name: Refresh advisories

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the latest advisories
        run: python tools/update_advisories.py

      - name: Open a pull request if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet src/quantpreflight/hardware/advisories.json; then
            echo "No new advisories."
            exit 0
          fi
          branch="advisories-$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src/quantpreflight/hardware/advisories.json
          git commit -m "Refresh engine advisories"
          git push origin "$branch"
          gh pr create --fill --base main
