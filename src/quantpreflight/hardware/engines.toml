# Declarative inference engine container, format, and alignment rules.

# Methods checked against the list vLLM 0.33 reports when it rejects one
[[engines]]
id = "vllm"
name = "vLLM"
supported_containers = ["safetensors", "gguf", "pytorch_bin"]
supported_quant_methods = [
    "none",
    "awq",
    "gptq",
    "compressed-tensors",
    "fp8",
    "nvfp4",
    "mxfp4",
    "autoround",
    "gguf",
    "torchao",
    "quark",
]
marlin_in_align = 128
marlin_out_align = 64
fp8_block_restricted_arches = ["sm_89"]

